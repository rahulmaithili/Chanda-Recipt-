<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanda System - Audit Logs</title>
    <style>
        .filter-card {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .filter-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
            height: 38px;
        }

        .table-card {
            background: var(--card);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            background: rgba(0,0,0,0.01);
            font-weight: bold;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;"><i class="fas fa-history"></i> <span id="lbl_audit_logs">Audit Logs</span></h2>
    </div>

    <!-- Filter Card -->
    <div class="filter-card">
        <div class="filter-row">
            <div class="filter-group">
                <label>Search Details (खोजें)</label>
                <input type="text" id="filter_search" placeholder="Username, action, details...">
            </div>
            <div class="filter-group">
                <label>From Date (से)</label>
                <input type="date" id="filter_from">
            </div>
            <div class="filter-group">
                <label>To Date (तक)</label>
                <input type="date" id="filter_to">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-dark" onclick="applyFilters()"><i class="fas fa-filter"></i> Filter</button>
                <button class="btn btn-secondary" onclick="resetFilters()"><i class="fas fa-undo"></i> Reset</button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-card">
        <div style="overflow-x:auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Mobile</th>
                        <th>Action</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="logs_tbody">
                    <!-- Dynamic -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="includes/header.js"></script>
<script>
    let rawLogs = [];

    document.addEventListener("DOMContentLoaded", async () => {
        translateLabels();
        await loadLogs();
    });

    function translateLabels() {
        document.getElementById("lbl_audit_logs").innerText = __("audit_logs");
    }

    async function loadLogs() {
        try {
            const res = await fetch(`${API_URL}?action=getLogs`);
            const data = await res.json();
            if (data.success) {
                rawLogs = data.logs || [];
                renderTable(rawLogs);
            }
        } catch(e) {
            console.error("Failed to load logs from API", e);
        }
    }

    function renderTable(list) {
        const tbody = document.getElementById("logs_tbody");
        tbody.innerHTML = "";

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="padding:20px; text-align:center; color:var(--muted);">${__('no_records_found')}</td></tr>`;
            return;
        }

        // Sort descending by timestamp
        const sorted = [...list].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

        sorted.forEach(l => {
            const timeStr = new Date(l.timestamp).toLocaleString('en-IN');
            const actionBadgeColor = l.action.includes("Login") ? "#39cccc" : (l.action.includes("Added") ? "#2ecc40" : "#ff4136");
            
            tbody.innerHTML += `
                <tr style="border-bottom:1px solid var(--border);">
                    <td>${timeStr}</td>
                    <td><strong>${l.user_name}</strong></td>
                    <td>${l.user_mobile || '-'}</td>
                    <td><span class="erp-badge" style="background:${actionBadgeColor};">${l.action}</span></td>
                    <td>${l.details}</td>
                </tr>
            `;
        });
    }

    function applyFilters() {
        const search = document.getElementById("filter_search").value.toLowerCase().trim();
        const fromDate = document.getElementById("filter_from").value;
        const toDate = document.getElementById("filter_to").value;

        const filtered = rawLogs.filter(l => {
            const matchSearch = l.user_name.toLowerCase().includes(search) || 
                                l.action.toLowerCase().includes(search) || 
                                (l.details && l.details.toLowerCase().includes(search));
                                
            let matchDate = true;
            if (fromDate || toDate) {
                const lDate = new Date(l.timestamp).setHours(0,0,0,0);
                if (fromDate) {
                    const f = new Date(fromDate).setHours(0,0,0,0);
                    if (lDate < f) matchDate = false;
                }
                if (toDate) {
                    const t = new Date(toDate).setHours(23,59,59,999);
                    if (lDate > t) matchDate = false;
                }
            }
            return matchSearch && matchDate;
        });

        renderTable(filtered);
    }

    function resetFilters() {
        document.getElementById("filter_search").value = "";
        document.getElementById("filter_from").value = "";
        document.getElementById("filter_to").value = "";
        renderTable(rawLogs);
    }
</script>
</body>
</html>
