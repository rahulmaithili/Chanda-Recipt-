<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanda System - Accounts & Handover</title>
    <style>
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .account-card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .account-card h3 {
            margin: 0;
            font-size: 24px;
            color: var(--orange);
        }

        .account-card p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--muted);
            font-weight: bold;
        }

        .handover-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            border-bottom: 2px solid var(--orange);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .handover-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;"><i class="fas fa-wallet"></i> <span id="lbl_accounts_handover">Accounts & Handover</span></h2>
    </div>

    <!-- Accounts Balances -->
    <div class="accounts-grid" id="accounts_container">
        <!-- Dynamic account cards -->
    </div>

    <!-- Handover Actions Layout -->
    <div class="handover-layout">
        <!-- Left: Submit Request Form -->
        <div class="card">
            <h3 id="lbl_submit_handover">Submit Handover (जमा करें)</h3>
            <div id="error" style="color:red; font-weight:bold; margin-bottom:10px; display:none;"></div>
            <form id="handoverForm">
                <div class="form-group">
                    <label id="lbl_amount">Amount (राशि) *</label>
                    <input type="number" step="0.01" id="amount" required placeholder="e.g. 5000">
                </div>
                <div class="form-group">
                    <label id="lbl_deposit_mode">Deposit Mode *</label>
                    <select id="mode" required>
                        <option value="Cash">Cash (नकद)</option>
                        <option value="Online">Online Deposit (UPI/Bank)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl_transfer_date">Transfer Date *</label>
                    <input type="date" id="transfer_date" required>
                </div>
                <div class="form-group">
                    <label id="lbl_select_destination">Select Destination Account *</label>
                    <select id="account_id" required>
                        <!-- Dynamic options -->
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl_remarks">Remarks / Reference No</label>
                    <input type="text" id="remark" placeholder="e.g. Txn ID or handed to person">
                </div>
                <button type="submit" class="btn" style="width:100%;"><i class="fas fa-paper-plane"></i> Submit Request</button>
            </form>
        </div>

        <!-- Right: Handover History & Approvals -->
        <div class="card">
            <h3>Handover History & Approvals</h3>
            <div style="overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse; font-size:12px; text-align:left;">
                    <thead>
                        <tr style="border-bottom:2px solid var(--border); font-weight:bold; color:var(--muted);">
                            <th style="padding:10px;">Collector</th>
                            <th style="padding:10px;">Date</th>
                            <th style="padding:10px;">Amount</th>
                            <th style="padding:10px;">To Wallet</th>
                            <th style="padding:10px;">Status</th>
                            <th style="padding:10px; text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="handovers_tbody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="includes/header.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        translateLabels();
        document.getElementById("transfer_date").value = new Date().toLocaleDateString('en-CA');
        await loadAccountsAndHandovers();
    });

    function translateLabels() {
        document.getElementById("lbl_accounts_handover").innerText = __("accounts_handover");
        document.getElementById("lbl_submit_handover").innerText = __("submit_handover");
        document.getElementById("lbl_amount").innerText = __("amount") + " *";
        document.getElementById("lbl_deposit_mode").innerText = __("deposit_mode") + " *";
        document.getElementById("lbl_transfer_date").innerText = __("transfer_date") + " *";
        document.getElementById("lbl_select_destination").innerText = __("select_destination") + " *";
        document.getElementById("lbl_remarks").innerText = __("remarks");
    }

    async function loadAccountsAndHandovers() {
        const sysData = await getSystemData();
        if (!sysData) return;

        const accounts = sysData.accounts || [];
        const handovers = sysData.handovers || [];

        // 1. Render Account Cards
        const accContainer = document.getElementById("accounts_container");
        accContainer.innerHTML = "";
        
        // Render selector options as well
        const accSelect = document.getElementById("account_id");
        accSelect.innerHTML = `<option value="">-- Choose Target --</option>`;

        accounts.forEach(a => {
            accContainer.innerHTML += `
                <div class="account-card">
                    <h3>₹${parseFloat(a.balance).toLocaleString('en-IN', {minimumFractionDigits: 2})}</h3>
                    <p>${a.account_name}</p>
                </div>
            `;
            accSelect.innerHTML += `<option value="${a.id}">${a.account_name}</option>`;
        });

        // 2. Render Handover List
        const tbody = document.getElementById("handovers_tbody");
        tbody.innerHTML = "";

        if (handovers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="padding:15px; text-align:center; color:var(--muted);">${__('no_records_found')}</td></tr>`;
            return;
        }

        // Sort handovers descending
        const sorted = [...handovers].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

        sorted.forEach(h => {
            const acc = accounts.find(a => a.id == h.account_id);
            const accName = acc ? acc.account_name : `Wallet #${h.account_id}`;
            const dateStr = new Date(h.transfer_date).toLocaleDateString('en-IN');
            
            const isPending = h.status === "Pending" || h.status === "pending";
            const badgeColor = isPending ? "#ff851b" : (h.status === "Approved" ? "#2ecc40" : "#ff4136");
            
            // Generate Approval actions for admins
            let actionHtml = '-';
            if (isPending && isAdmin()) {
                actionHtml = `<button class="btn btn-dark" style="padding:4px 8px; font-size:10px;" onclick="approveRequest('${h.id}')"><i class="fas fa-check-circle"></i> Approve</button>`;
            } else if (!isPending) {
                actionHtml = `<small style="color:var(--muted)">Approved by: ${h.approved_by || '-'}</small>`;
            }

            tbody.innerHTML += `
                <tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:10px;"><strong>${h.collector_name}</strong><br><small style="color:var(--muted)">${h.collector_mobile}</small></td>
                    <td style="padding:10px;">${dateStr}</td>
                    <td style="padding:10px; font-weight:600;">₹${parseFloat(h.amount).toFixed(2)}</td>
                    <td style="padding:10px;">${accName}</td>
                    <td style="padding:10px;"><span class="erp-badge" style="background:${badgeColor};">${h.status}</span></td>
                    <td style="padding:10px; text-align:right;">${actionHtml}</td>
                </tr>
            `;
        });
    }

    document.getElementById("handoverForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const errDiv = document.getElementById("error");
        errDiv.style.display = "none";
        
        const currentUser = getCurrentUser();
        const viewingFestId = getViewingFestivalId();

        const handoverData = {
            collector_name: currentUser.name,
            collector_mobile: currentUser.mobile,
            amount: parseFloat(document.getElementById("amount").value),
            mode: document.getElementById("mode").value,
            transfer_date: document.getElementById("transfer_date").value,
            account_id: document.getElementById("account_id").value,
            remark: document.getElementById("remark").value.trim(),
            festival_id: viewingFestId
        };

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "submitHandover",
                    handover: handoverData,
                    currentUser: currentUser
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                alert("हैंडओवर रिक्वेस्ट सफलतापूर्वक जमा की गई!");
                window.location.reload();
            } else {
                errDiv.innerText = "Error: " + data.message;
                errDiv.style.display = "block";
            }
        } catch(err) {
            console.error(err);
            errDiv.innerText = "Network Error.";
            errDiv.style.display = "block";
        }
    });

    async function approveRequest(hndId) {
        if (!confirm("क्या आप इस हैंडओवर अनुरोध को स्वीकृत करना चाहते हैं?")) return;

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "approveHandover",
                    handover_id: hndId,
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                alert("अनुरोध स्वीकृत हो गया और राशि टारगेट वॉलेट में जोड़ दी गई!");
                window.location.reload();
            } else {
                alert("त्रुटि: " + data.message);
            }
        } catch(e) {
            console.error(e);
            alert("नेटवर्क त्रुटि।");
        }
    }
</script>
</body>
</html>
