<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanda System - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .kpi-card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .kpi-card h3 {
            margin: 0;
            font-size: 28px;
            color: var(--text);
            font-weight: 700;
        }

        .kpi-card p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .kpi-card i {
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-size: 32px;
            opacity: 0.15;
            color: var(--orange);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .chart-container h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 700;
            border-bottom: 2px solid var(--orange);
            padding-bottom: 8px;
            color: var(--text);
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;"><i class="fas fa-home"></i> <span id="lbl_dashboard">Dashboard</span></h2>
        <button class="btn btn-dark" onclick="syncData()"><i class="fas fa-sync"></i> Sync Data</button>
    </div>

    <!-- Stats Grid -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <h3 id="stat_donation">₹0.00</h3>
            <p id="lbl_total_donation">Total Donation</p>
            <i class="fas fa-hand-holding-usd"></i>
        </div>
        <div class="kpi-card">
            <h3 id="stat_expense" style="color:#ff4136;">₹0.00</h3>
            <p id="lbl_total_expense">Total Expense</p>
            <i class="fas fa-tags"></i>
        </div>
        <div class="kpi-card">
            <h3 id="stat_balance" style="color:#2ecc40;">₹0.00</h3>
            <p id="lbl_balance">Balance</p>
            <i class="fas fa-wallet"></i>
        </div>
        <div class="kpi-card">
            <h3 id="stat_my_collection">₹0.00</h3>
            <p id="lbl_my_collection">My Collection</p>
            <i class="fas fa-user-shield"></i>
        </div>
    </div>

    <!-- Charts Layout -->
    <div class="charts-grid">
        <div class="chart-container">
            <h3 id="lbl_village_wise">Village-wise Collection</h3>
            <canvas id="villageChart" style="max-height: 280px;"></canvas>
        </div>
        <div class="chart-container">
            <h3 id="lbl_category_wise">Category-wise Expenses</h3>
            <canvas id="categoryChart" style="max-height: 280px;"></canvas>
        </div>
    </div>

    <!-- Recent Donations -->
    <div class="chart-container" style="margin-bottom: 20px;">
        <h3 id="lbl_recent_donations">Recent Donations</h3>
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
                <thead>
                    <tr style="border-bottom:2px solid var(--border); font-weight:bold; color:var(--muted);">
                        <th style="padding:10px;">Receipt No</th>
                        <th style="padding:10px;">Date</th>
                        <th style="padding:10px;">Donor Name</th>
                        <th style="padding:10px;">Village</th>
                        <th style="padding:10px;">Amount</th>
                        <th style="padding:10px;">Collected By</th>
                    </tr>
                </thead>
                <tbody id="recent_donations_tbody">
                    <!-- Dynamic -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="includes/header.js"></script>
<script>
    let villageChartInstance = null;
    let categoryChartInstance = null;

    document.addEventListener("DOMContentLoaded", async () => {
        translateLabels();
        await loadDashboard(false);
    });

    function translateLabels() {
        document.getElementById("lbl_dashboard").innerText = __("dashboard");
        document.getElementById("lbl_total_donation").innerText = __("total_donation");
        document.getElementById("lbl_total_expense").innerText = __("total_expense");
        document.getElementById("lbl_balance").innerText = __("balance");
        document.getElementById("lbl_my_collection").innerText = __("my_collection");
        document.getElementById("lbl_village_wise").innerText = __("village_wise");
        document.getElementById("lbl_category_wise").innerText = __("category_wise");
        document.getElementById("lbl_recent_donations").innerText = __("recent_donations");
    }

    async function syncData() {
        await loadDashboard(true);
    }

    async function loadDashboard(forceSync = false) {
        const sysData = await getSystemData(forceSync);
        if (!sysData) return;

        const donations = sysData.donations || [];
        const expenses = sysData.expenses || [];
        const user = getCurrentUser();

        // 1. Calculate KPI Values
        let totalDonation = 0;
        donations.forEach(d => totalDonation += parseFloat(d.amount || 0));

        let totalExpense = 0;
        expenses.forEach(e => {
            if (e.status === 'Approved' || e.status === 'approved') {
                totalExpense += parseFloat(e.amount || 0);
            }
        });

        const netBalance = totalDonation - totalExpense;

        let myCollection = 0;
        if (user) {
            donations.forEach(d => {
                if (d.collected_by_mobile === user.mobile) {
                    myCollection += parseFloat(d.amount || 0);
                }
            });
        }

        // Render KPIs
        document.getElementById("stat_donation").innerText = '₹' + totalDonation.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById("stat_expense").innerText = '₹' + totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById("stat_balance").innerText = '₹' + netBalance.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById("stat_my_collection").innerText = '₹' + myCollection.toLocaleString('en-IN', {minimumFractionDigits: 2});

        // 2. Render Recent Donations Table
        const recentTbody = document.getElementById("recent_donations_tbody");
        recentTbody.innerHTML = "";
        
        // Sort donations by date / timestamp descending, take top 5
        const sortedDonations = [...donations].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 5);
        
        if (sortedDonations.length === 0) {
            recentTbody.innerHTML = `<tr><td colspan="6" style="padding:15px; text-align:center; color:var(--muted);">${__('no_records_found')}</td></tr>`;
        } else {
            sortedDonations.forEach(d => {
                recentTbody.innerHTML += `
                    <tr style="border-bottom: 1px solid var(--border);">
                        <td style="padding:10px;">#${d.receipt_no}</td>
                        <td style="padding:10px;">${new Date(d.timestamp).toLocaleDateString('en-IN')}</td>
                        <td style="padding:10px;"><strong>${d.donor_name}</strong></td>
                        <td style="padding:10px;">${d.village}</td>
                        <td style="padding:10px; font-weight:600; color:#27ae60;">₹${parseFloat(d.amount).toFixed(2)}</td>
                        <td style="padding:10px;">${d.collected_by_name}</td>
                    </tr>
                `;
            });
        }

        // 3. Render Village Wise Pie Chart
        const villageSums = {};
        donations.forEach(d => {
            villageSums[d.village] = (villageSums[d.village] || 0) + parseFloat(d.amount || 0);
        });

        const vLabels = Object.keys(villageSums);
        const vValues = Object.values(villageSums);

        if (villageChartInstance) villageChartInstance.destroy();
        const ctxV = document.getElementById("villageChart").getContext("2d");
        villageChartInstance = new Chart(ctxV, {
            type: 'pie',
            data: {
                labels: vLabels,
                datasets: [{
                    data: vValues,
                    backgroundColor: ['#2ecc40', '#ff851b', '#0074d9', '#ff4136', '#b10dc9', '#ffdc00', '#39cccc', '#01ff70']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        // 4. Render Category Wise Expenses Bar Chart
        const catSums = {};
        expenses.forEach(e => {
            if (e.status === 'Approved' || e.status === 'approved') {
                catSums[e.category] = (catSums[e.category] || 0) + parseFloat(e.amount || 0);
            }
        });

        const cLabels = Object.keys(catSums);
        const cValues = Object.values(catSums);

        if (categoryChartInstance) categoryChartInstance.destroy();
        const ctxC = document.getElementById("categoryChart").getContext("2d");
        categoryChartInstance = new Chart(ctxC, {
            type: 'bar',
            data: {
                labels: cLabels,
                datasets: [{
                    label: 'Expenses (₹)',
                    data: cValues,
                    backgroundColor: '#ff851b',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }
</script>
</body>
</html>
