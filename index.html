      const handovers = systemData.handovers || [];
      const accounts = systemData.accounts || [];

      const uniqueCollectors = Array.from(new Set(handovers.map(h => h.collector_name)));

      const filteredHandovers = handovers.filter(h => {
        const matchesCollector = collectorFilter === 'All' || h.collector_name === collectorFilter;
        // Non-super users should only see their own entries
        const matchesUserScope = isSuper || h.collector_mobile === user.mobile;
        return matchesCollector && matchesUserScope;
      });

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!amount || parseFloat(amount) <= 0) return alert("Please enter a valid amount.");
        const ok = await onAction("submitHandover", {
          handover: {
            collector_name: user.name,
            collector_mobile: user.mobile,
            amount: parseFloat(amount),
            mode: "Cash",
            transfer_date: new Date().toISOString().slice(0, 10),
            account_id: accountId,
            festival_id: getViewingFestivalId(),
            remark: remark
          }
        });
        if (ok) {
          setAmount('');
          setRemark('');
        }
      };

      return (
        <div className="split-layout">
          <div className="card">
            <h3 style={{ color: 'var(--navy-accent)', marginBottom: '15px' }}><i className="fas fa-paper-plane"></i> {t('handover_submit')}</h3>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>{t('amount')} *</label>
                <input type="number" placeholder="₹" value={amount} onChange={e => setAmount(e.target.value)} required />
              </div>
              <div className="form-group">
                <label>{t('destination_account')}</label>
                <select value={accountId} onChange={e => setAccountId(e.target.value)}>
                  {accounts.map(acc => (
                    <option key={acc.id} value={acc.id}>{acc.account_name} (Bal: ₹{parseFloat(acc.balance).toFixed(2)})</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>{t('notes')}</label>
                <textarea rows="3" placeholder="..." value={remark} onChange={e => setRemark(e.target.value)}></textarea>
              </div>
              <button type="submit" className="btn" style={{ width: '100%' }}>{t('save')}</button>
            </form>
          </div>

          <div className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
              <h3 style={{ color: 'var(--navy-accent)', margin: 0 }}><i className="fas fa-wallet"></i> {t('handover_history')}</h3>
              <button className="btn btn-secondary btn-sm" onClick={() => printReportTable(t('handover_history'), document.getElementById('handover-history-table').outerHTML, systemData.settings)} style={{ padding: '4px 10px', fontSize: '11px', background: '#34495e', display: 'flex', alignItems: 'center', gap: '5px' }}><i className="fas fa-print"></i> {t('print')}</button>

            {isSuper && (
              <div className="form-group" style={{ marginBottom: '15px' }}>
                <label style={{ fontSize: '11px', fontWeight: 'bold' }}>FILTER BY COLLECTOR</label>
                <select value={collectorFilter} onChange={e => setCollectorFilter(e.target.value)} style={{ padding: '6px 10px', fontSize: '12px', width: '100%', maxWidth: '200px' }}>
                  <option value="All">All Collectors</option>
                  {uniqueCollectors.map(name => (
                    <option key={name} value={name}>{name}</option>
                  ))}
                </select>
              </div>
            )}

            <div className="table-responsive">
              <table id="handover-history-table">
                <thead>
                  <tr>
                    <th>{t('username')}</th>
                    <th>{t('amount')}</th>
                    <th>{t('status')}</th>
                    <th>{t('actions')}</th>
                  </tr>

                  {filteredHandovers.map(h => (

                      <td><strong>{h.collector_name}</strong><br/><small style={{ color: 'var(--text-muted)' }}>{h.transfer_date}</small></td>
                      <td style={{ fontWeight: 'bold' }}>₹{parseFloat(h.amount).toFixed(2)}</td>
                      <td>
                        <span style={{ padding: '3px 8px', borderRadius: '15px', fontSize: '11px', fontWeight: 'bold', background: h.status === 'Approved' ? '#d2f4ea' : '#fff0d3', color: h.status === 'Approved' ? '#0f766e' : '#a46000' }}>
                          {h.status === 'Approved' ? t('approved') : t('pending')}
                        </span>
                      </td>
                      <td>
                        {isSuper && h.status === "Pending" && (
                          <button className="btn btn-success btn-sm" onClick={() => onAction("approveHandover", { handover_id: h.id })} style={{ padding: '3px 8px', fontSize: '11px' }}>
                            {t('approve')}

            </div>
          </div>
        </div>
      );
    }

    // Modernized UsersView Component matching Screenshot 2 table layout & filters
    function UsersView({ systemData, onEdit, onAdd, onDelete, hasPermission, t }) {
      const [search, setSearch] = useState('');
      const [roleFilter, setRoleFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');

      const users = systemData.users || [];

      const filtered = users.filter(u => {
        const matchesSearch = u.name.toLowerCase().includes(search.toLowerCase()) || u.mobile.includes(search);
        const matchesRole = roleFilter === 'All' || (u.role || '').toLowerCase() === roleFilter.toLowerCase();
        const matchesStatus = statusFilter === 'All' || u.status === statusFilter;
        return matchesSearch && matchesRole && matchesStatus;
      });

      const handleClear = () => {
        setSearch('');
        setRoleFilter('All');
        setStatusFilter('All');
      };

      const handleExportCSV = () => {
        let headers = ["Username", "Mobile (Login)", "Role", "Status", "Village Assigned"];
        let rows = filtered.map(u => [u.name, u.mobile, u.role, u.status, u.village || "N/A"]);
        let csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `users_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

        <div>

    // Modernized RbacView Component matching Screenshot 5 unified matrix layout
    function RbacView({ systemData, onAction, t }) {
      const roles = systemData.roles || [];
      const pages = systemData.rbacPages || [];

      // Group pages by group/category
      const groups = {};
      pages.forEach(p => {
        const g = p.group || 'GENERAL';
        if (!groups[g]) groups[g] = [];
        groups[g].push(p);
      });

      return (
        <div className="card">
          <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <h2 style={{ fontSize: '18px', color: 'var(--navy-primary)' }}><i className="fas fa-key"></i> {t('roles')} Matrix</h2>
              <small style={{ color: 'var(--text-muted)' }}>Home / {t('roles')}</small>
            </div>
          </div>
          <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '5px 0 20px' }}>
            Toggle <strong>V</strong>iew, <strong>A</strong>dd, <strong>E</strong>dit, <strong>D</strong>elete permissions per role. Changes save instantly. Super Admin (owner) is locked to full access.
          </p>

          <div className="table-responsive" style={{ border: '1px solid rgba(0,0,0,0.08)', borderRadius: '8px' }}>
            <table style={{ minWidth: '800px' }}>
              <thead>
                <tr>
                  <th style={{ width: '250px' }}>Page</th>
                  {roles.map(role => (
                    <th key={role.role_key} style={{ textAlign: 'center', background: 'rgba(0,0,0,0.01)', borderLeft: '1px solid rgba(0,0,0,0.05)' }}>
                      <span style={{ display: 'block', fontSize: '13px', fontWeight: 'bold' }}>{role.label}</span>
                      <small style={{ display: 'block', fontSize: '10px', color: 'var(--text-muted)', letterSpacing: '2px', marginTop: '2px' }}>V • A • E • D</small>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {Object.keys(groups).map(groupName => (
                  <React.Fragment key={groupName}>
                    {/* Category Divider row */}
                    <tr style={{ background: '#f8f9fa' }}>
                      <td colSpan={1 + roles.length} style={{ fontWeight: 'bold', fontSize: '11px', textTransform: 'uppercase', color: 'var(--navy-primary)', padding: '8px 15px', letterSpacing: '0.5px' }}>
                        {groupName}
                      </td>
                    </tr>
                    {groups[groupName].map(page => (
                      <tr key={page.key}>
                        <td style={{ paddingLeft: '25px' }}>
                          <span style={{ fontWeight: '600', fontSize: '13px' }}>{page.label}</span>
                        </td>
                        {roles.map(role => {
                          let perms = {};
                          try { perms = JSON.parse(role.permissions || '{}'); } catch(e) {}
                          const pPerm = perms[page.key] || { v: 0, a: 0, e: 0, d: 0 };
                          const isLocked = Number(role.is_super) === 1;

                          const toggle = (permKey) => {
                            if (isLocked) return;
                            const newVal = !pPerm[permKey];
                            onAction("toggleRbac", {
                              roleKey: role.role_key,
                              pageKey: page.key,
                              permKey: permKey,
                              value: newVal
                            });
                          };

                          return (
                            <td key={role.role_key} style={{ textAlign: 'center', borderLeft: '1px solid rgba(0,0,0,0.05)' }}>
                              <div style={{ display: 'inline-flex', gap: '4px' }}>
                                <span 
                                  className={`rbac-toggle-badge ${pPerm.v ? 'active' : ''} ${isLocked ? 'disabled' : ''}`}
                                  onClick={() => toggle('v')}
                                  style={{
                                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                    width: '24px', height: '24px', fontSize: '11px', fontWeight: 'bold',
                                    borderRadius: '4px', cursor: isLocked ? 'not-allowed' : 'pointer',
                                    border: '1px solid rgba(0,0,0,0.1)',
                                    background: pPerm.v ? 'var(--success)' : '#fff',
                                    color: pPerm.v ? '#fff' : '#888'
                                  }}
                                >
                                  V
                                </span>
                                <span 
                                  className={`rbac-toggle-badge ${pPerm.a ? 'active' : ''} ${isLocked ? 'disabled' : ''}`}
                                  onClick={() => toggle('a')}
                                  style={{
                                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                    width: '24px', height: '24px', fontSize: '11px', fontWeight: 'bold',
                                    borderRadius: '4px', cursor: isLocked ? 'not-allowed' : 'pointer',
                                    border: '1px solid rgba(0,0,0,0.1)',
                                    background: pPerm.a ? 'var(--success)' : '#fff',
                                    color: pPerm.a ? '#fff' : '#888'
                                  }}
                                >
                                  A
                                </span>
                                <span 
                                  className={`rbac-toggle-badge ${pPerm.e ? 'active' : ''} ${isLocked ? 'disabled' : ''}`}
                                  onClick={() => toggle('e')}
                                  style={{
                                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                    width: '24px', height: '24px', fontSize: '11px', fontWeight: 'bold',
                                    borderRadius: '4px', cursor: isLocked ? 'not-allowed' : 'pointer',
                                    border: '1px solid rgba(0,0,0,0.1)',
                                    background: pPerm.e ? 'var(--success)' : '#fff',
                                    color: pPerm.e ? '#fff' : '#888'
                                  }}
                                >
                                  E
                                </span>
                                <span 
                                  className={`rbac-toggle-badge ${pPerm.d ? 'active' : ''} ${isLocked ? 'disabled' : ''}`}
                                  onClick={() => toggle('d')}
                                  style={{
                                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                    width: '24px', height: '24px', fontSize: '11px', fontWeight: 'bold',
                                    borderRadius: '4px', cursor: isLocked ? 'not-allowed' : 'pointer',
                                    border: '1px solid rgba(0,0,0,0.1)',
                                    background: pPerm.d ? 'var(--success)' : '#fff',
                                    color: pPerm.d ? '#fff' : '#888'
                                  }}
                                >
                                  D
                                </span>
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ExpenseFormModal({ record, parentRecord, expenses, categories, accounts, onClose, onSave, t }) {
      const [title, setTitle] = useState(record?.title || (parentRecord ? `Installment for ${parentRecord.title}` : ''));
      const [category, setCategory] = useState(record?.category || parentRecord?.category || (categories[0]?.name || ''));
      const [amount, setAmount] = useState(record?.amount || '');
      const [mode, setMode] = useState(record?.mode || 'Cash');
      const [accountId, setAccountId] = useState(record?.account_id || accounts[0]?.id || '1');
      const [status, setStatus] = useState(record?.status || 'Pending');
      const [note, setNote] = useState(record?.note || '');
      const [isContract, setIsContract] = useState(!!(record?.total_contract_amount || parentRecord));
      const [totalContractAmount, setTotalContractAmount] = useState(record?.total_contract_amount || parentRecord?.total_contract_amount || '');

      let remainingBalance = 0;
      if (parentRecord) {
        const installments = expenses.filter(e => e.parent_expense_no === parentRecord.expense_no);
        const paidSoFar = parseFloat(parentRecord.amount) + installments.reduce((sum, ins) => sum + parseFloat(ins.amount || 0), 0);
        remainingBalance = parseFloat(parentRecord.total_contract_amount) - paidSoFar;
      }

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !amount) return alert("Required fields missing.");
        
        const finalContractAmt = parentRecord 
          ? parseFloat(parentRecord.total_contract_amount)
          : (isContract ? parseFloat(totalContractAmount) : 0);

        if (parentRecord && parseFloat(amount) > remainingBalance) {
          return alert(`Amount cannot exceed remaining contract balance of ₹${remainingBalance}`);
        }

        onSave({
          title: title.trim(),
          category: category,
          amount: parseFloat(amount),
          mode: mode,
          account_id: accountId,
          status: status,
          note: note.trim(),
          festival_id: getViewingFestivalId(),
          added_by_name: record ? record.added_by_name : JSON.parse(localStorage.getItem("currentUser")).name,
          added_by_mobile: record ? record.added_by_mobile : JSON.parse(localStorage.getItem("currentUser")).mobile,
          date: record ? record.date : new Date().toISOString().slice(0, 10),
          expense_no: record?.expense_no,
          total_contract_amount: finalContractAmt,
          parent_expense_no: parentRecord ? parentRecord.expense_no : record?.parent_expense_no
        });
      };

      return (
        <div className="modal-slideover-overlay">
          <div className="modal-slideover">

              <h3><i className="fas fa-tags"></i> {record ? t('edit_expense') : (parentRecord ? 'Pay Vendor Due' : t('add_expense'))}</h3>

                {/* Form Inputs */}
                <div>
                  <div className="form-group">
                    <label>{t('title')} *</label>
                    <input type="text" value={title} onChange={e => setTitle(e.target.value)} required disabled={!!parentRecord} />
                  </div>
                  <div className="form-group">
                    <label>{t('category_name')} *</label>
                    <select value={category} onChange={e => setCategory(e.target.value)} disabled={!!parentRecord}>
                      {categories.map(c => (
                        <option key={c.id} value={c.name}>{c.name}</option>
                      ))}
                    </select>

    // Modernized UserFormModal Component matching Screenshot 3 side-by-side grid
    function UserFormModal({ record, villages, onClose, onSave, t }) {
      const [name, setName] = useState(record?.name || '');
      const [mobile, setMobile] = useState(record?.mobile || '');
      const [password, setPassword] = useState('');
      const getNormalizedRole = (r) => {
        if (!r) return 'Collector';
        const lower = r.toLowerCase();
        if (lower === 'super admin') return 'Super Admin';
        if (lower === 'admin') return 'Admin';
        return 'Collector';
      };
      const [role, setRole] = useState(getNormalizedRole(record?.role));
      const [village, setVillage] = useState(record?.village || '');
      const [targetDonation, setTargetDonation] = useState(record?.target_donation || '');
      const [status, setStatus] = useState(record?.status || 'active');
      const [allowLogin, setAllowLogin] = useState(record?.allow_login !== undefined ? (record.allow_login == 1 || record.allow_login === true) : true);
      const [picBase64, setPicBase64] = useState(null);
      const [picPreview, setPicPreview] = useState(record?.profile_pic || '');

      const handlePicChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          setPicBase64(reader.result);
          setPicPreview(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const payload = {
          id: record?.id,
          name: name.trim(),
          mobile: mobile.trim(),
          password: password || (record?.id ? undefined : "123"),
          role: role,
          village: village,
          target_donation: targetDonation ? parseFloat(targetDonation) : 0,
          status: status,
          allow_login: allowLogin ? 1 : 0
        };
        if (picBase64) {
          payload.profile_pic_base64 = picBase64;
        }
        onSave(payload);
      };

      return (
        <div className="modal-slideover-overlay">
          <div className="modal-slideover" style={{ width: '600px' }}>
            <div className="slideover-header">
              <h3><i className="fas fa-user-plus"></i> {record ? t('edit_user') : t('add_user')}</h3>
              <button className="hamburger-btn" onClick={onClose} style={{ fontSize: '24px' }}>&times;</button>
            </div>
            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
              <div className="slideover-body">
                {/* Profile Pic Upload Section */}
                <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                  <div style={{ position: 'relative', width: '80px', height: '80px' }}>
                    {picPreview ? (
                      <img src={picPreview} alt="Preview" style={{ width: '100%', height: '100%', borderRadius: '50%', objectFit: 'cover', border: '2px solid var(--navy-accent)' }} />
                    ) : (
                      <div style={{ width: '100%', height: '100%', borderRadius: '50%', background: 'rgba(0,0,0,0.05)', display: 'flex', justifyContent: 'center', alignItems: 'center', fontSize: '24px', color: 'var(--text-muted)' }}>
                        <i className="fas fa-user"></i>
                      </div>
                    )}
                    <label htmlFor="user-avatar-file" style={{ position: 'absolute', bottom: '0', right: '0', background: 'var(--navy-accent)', color: '#fff', width: '26px', height: '26px', borderRadius: '50%', display: 'flex', justifyContent: 'center', alignItems: 'center', cursor: 'pointer', boxShadow: '0 2px 5px rgba(0,0,0,0.2)' }}>
                      <i className="fas fa-camera" style={{ fontSize: '10px' }}></i>
                    </label>
                    <input id="user-avatar-file" type="file" accept="image/*" onChange={handlePicChange} style={{ display: 'none' }} />
                  </div>
                </div>

                {/* Two Column Grid Layout */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px' }}>
                  <div className="form-group">
                    <label>{t('username')} *</label>
                    <input type="text" value={name} onChange={e => setName(e.target.value)} required placeholder="..." />
                  </div>
                  <div className="form-group">
                    <label>{t('mobile')} (ID) *</label>
                    <input type="text" value={mobile} onChange={e => setMobile(e.target.value)} required placeholder="10-digit number" />
                  </div>
                  <div className="form-group">
                    <label>{t('password')}</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="..." />
                  </div>
                  <div className="form-group">
                    <label>{t('role')}</label>
                    <select value={role} onChange={e => setRole(e.target.value)}>
                      <option value="Collector">{getRoleDisplayName('Collector')}</option>
                      <option value="Admin">{getRoleDisplayName('Admin')}</option>
                      <option value="Super Admin">{getRoleDisplayName('Super Admin')}</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>{t('status')}</label>
                    <select value={status} onChange={e => setStatus(e.target.value)}>
                      <option value="active">Active</option>
                      <option value="inactive">Inactive</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>{t('village_assigned')}</label>
                    <select value={village} onChange={e => setVillage(e.target.value)}>
                      <option value="">None (All Villages)</option>
                      {villages.map(v => (
                        <option key={v.id} value={v.name}>{v.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>{t('target_collection')}</label>
                    <input type="number" placeholder="₹" value={targetDonation} onChange={e => setTargetDonation(e.target.value)} />
                  </div>
                  <div className="form-group" style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '20px' }}>
                    <input type="checkbox" id="user_allow_login" checked={allowLogin} onChange={e => setAllowLogin(e.target.checked)} style={{ width: 'auto' }} />
                    <label htmlFor="user_allow_login" style={{ margin: 0, cursor: 'pointer', fontWeight: '600' }}>Allow Website Login</label>
                  </div>
                </div>
              </div>
              <div className="slideover-footer">
                <button type="submit" className="btn">{t('save')}</button>
                <button type="button" className="btn btn-secondary" onClick={onClose}>{t('cancel')}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }
