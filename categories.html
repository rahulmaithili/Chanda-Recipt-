<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanda System - Expense Categories</title>
    <style>
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            color: var(--text);
            border-bottom: 2px solid var(--orange);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
        }

        .stat-card-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card .val {
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
        }

        .stat-card .lbl {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-card i {
            font-size: 24px;
            color: var(--orange);
            opacity: 0.3;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;"><i class="fas fa-list-ul"></i> Expense Categories Master</h2>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
            <button class="btn btn-dark" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
        </div>
    </div>

    <!-- Statistics Row -->
    <div class="stat-card-row">
        <div class="stat-card">
            <div>
                <div class="val" id="kpi_total_categories">0</div>
                <div class="lbl">Total Categories</div>
            </div>
            <i class="fas fa-list-ol"></i>
        </div>
        <div class="stat-card">
            <div>
                <div class="val" id="kpi_total_spent">₹0</div>
                <div class="lbl">Total Expenses</div>
            </div>
            <i class="fas fa-receipt"></i>
        </div>
    </div>

    <div class="layout-grid">
        <!-- Add New Category -->
        <div class="card">
            <h3>Add New Expense Category</h3>
            <form id="categoryForm">
                <div class="form-group">
                    <label>Category Name *</label>
                    <input type="text" id="cat_name" required placeholder="e.g. Tent & Decoration">
                </div>
                <button type="submit" class="btn" style="width:100%;"><i class="fas fa-plus"></i> Create Category</button>
            </form>
        </div>

        <!-- List of Categories -->
        <div class="card">
            <h3>Categories Summary</h3>
            <table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
                <thead>
                    <tr style="border-bottom:2px solid var(--border); font-weight:bold; color:var(--muted);">
                        <th style="padding:10px;">Category Name</th>
                        <th style="padding:10px;">Total Spent</th>
                        <th style="padding:10px; text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="categories_tbody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Category Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:8px; color:var(--orange);">Edit Category</h3>
        <form id="editForm">
            <input type="hidden" id="edit_cat_id">
            <div class="form-group">
                <label>Category Name *</label>
                <input type="text" id="edit_cat_name" required>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="config.js"></script>
<script src="includes/header.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        if (!isAdmin()) {
            showToast("Access denied.", "error");
            window.location.href = "index.html";
            return;
        }
        await loadCategoriesData();
    });

    function syncData() {
        loadCategoriesData();
    }

    async function loadCategoriesData() {
        const sysData = getSystemDataImmediate();
        if (!sysData) return;

        const categories = sysData.categories || [];
        const expenses = sysData.expenses || [];

        // Compute statistics per category
        const stats = {};
        categories.forEach(c => {
            stats[c.name] = { id: c.id, total: 0 };
        });

        expenses.forEach(ex => {
            const catName = ex.category;
            if (stats[catName]) {
                stats[catName].total += parseFloat(ex.amount || 0);
            }
        });

        // Set KPIs
        document.getElementById("kpi_total_categories").innerText = categories.length;
        let totalSpent = 0;
        expenses.forEach(ex => {
            if (ex.status === "Approved") {
                totalSpent += parseFloat(ex.amount || 0);
            }
        });
        document.getElementById("kpi_total_spent").innerText = "₹" + totalSpent.toLocaleString();

        // Populate Table
        const tbody = document.getElementById("categories_tbody");
        tbody.innerHTML = "";

        if (categories.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="padding:15px; text-align:center; color:var(--muted)">No categories found.</td></tr>`;
            return;
        }

        categories.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
            const rowStats = stats[c.name] || { id: c.id, total: 0 };
            tbody.innerHTML += `
                <tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:10px;"><strong>${c.name}</strong></td>
                    <td style="padding:10px; color:#ff4136; font-weight:bold;">₹${rowStats.total.toLocaleString()}</td>
                    <td style="padding:10px; text-align:right;">
                        <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="openEdit('${c.id}', '${c.name}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-dark" style="padding:4px 8px; font-size:11px; background:#ff4136;" onclick="deleteCategory('${c.id}', '${c.name}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById("categoryForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("cat_name").value.trim();

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "saveCategory",
                    category: { name: name },
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                showToast("खर्च श्रेणी सफलतापूर्वक जोड़ी गई!");
                window.location.reload();
            } else {
                showToast("त्रुटि: " + data.message, "error");
            }
        } catch(err) {
            showToast("कनेक्शन एरर!", "error");
        }
    });

    function openEdit(id, name) {
        document.getElementById("edit_cat_id").value = id;
        document.getElementById("edit_cat_name").value = name;
        document.getElementById("editModal").style.display = "flex";
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("edit_cat_id").value;
        const name = document.getElementById("edit_cat_name").value.trim();

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "saveCategory",
                    category: { id: id, name: name },
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                showToast("खर्च श्रेणी सफलतापूर्वक अपडेट की गई!");
                window.location.reload();
            } else {
                showToast("त्रुटि: " + data.message, "error");
            }
        } catch(err) {
            showToast("त्रुटि आई।", "error");
        }
    });

    async function deleteCategory(id, name) {
        if (!confirm(`क्या आप वाकई श्रेणी "${name}" को हटाना चाहते हैं?`)) return;

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "deleteRecord",
                    table: "categories",
                    keyColumn: "id",
                    value: id,
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                showToast("श्रेणी सफलतापूर्वक हटा दी गई है!");
                window.location.reload();
            } else {
                showToast("त्रुटि: " + data.message, "error");
            }
        } catch(err) {
            showToast("त्रुटि आई।", "error");
        }
    }

    function exportCSV() {
        let csv = [];
        let rows = document.querySelectorAll("table tr");
        for (let i = 0; i < rows.length; i++) {
            let row = [], cols = rows[i].querySelectorAll("td, th");
            for (let j = 0; j < cols.length - 1; j++) {
                let text = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, " ").trim();
                row.push('"' + text.replace(/"/g, '""') + '"');
            }
            csv.push(row.join(","));
        }
        let csvFile = new Blob([csv.join("\n")], {type: "text/csv;charset=utf-8;"});
        let downloadLink = document.createElement("a");
        downloadLink.download = "categories_stats.csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
    }
</script>
</body>
</html>
