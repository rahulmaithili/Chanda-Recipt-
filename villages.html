<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanda System - Villages Master</title>
    <style>
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            color: var(--text);
            border-bottom: 2px solid var(--orange);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
        }

        .stat-card-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card .val {
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
        }

        .stat-card .lbl {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-card i {
            font-size: 24px;
            color: var(--orange);
            opacity: 0.3;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;"><i class="fas fa-map-marked-alt"></i> Villages Master</h2>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
            <button class="btn btn-dark" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
        </div>
    </div>

    <!-- Statistics Row -->
    <div class="stat-card-row">
        <div class="stat-card">
            <div>
                <div class="val" id="kpi_total_villages">0</div>
                <div class="lbl">Total Villages</div>
            </div>
            <i class="fas fa-city"></i>
        </div>
        <div class="stat-card">
            <div>
                <div class="val" id="kpi_total_collected">₹0</div>
                <div class="lbl">Total Collection</div>
            </div>
            <i class="fas fa-hand-holding-usd"></i>
        </div>
        <div class="stat-card">
            <div>
                <div class="val" id="kpi_total_slips">0 slips</div>
                <div class="lbl">Total Receipts</div>
            </div>
            <i class="fas fa-receipt"></i>
        </div>
    </div>

    <div class="layout-grid">
        <!-- Add New Village -->
        <div class="card">
            <h3>Add New Village Location</h3>
            <form id="villageForm">
                <div class="form-group">
                    <label>Village Name *</label>
                    <input type="text" id="vil_name" required placeholder="e.g. गणेशखपरी">
                </div>
                <button type="submit" class="btn" style="width:100%;"><i class="fas fa-plus"></i> Create Village</button>
            </form>
        </div>

        <!-- List of Villages -->
        <div class="card">
            <h3>Villages & Collections Summary</h3>
            <table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
                <thead>
                    <tr style="border-bottom:2px solid var(--border); font-weight:bold; color:var(--muted);">
                        <th style="padding:10px;">Village Name</th>
                        <th style="padding:10px;">Total Collected</th>
                        <th style="padding:10px;">Receipts Generated</th>
                        <th style="padding:10px; text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="villages_tbody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Village Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:8px; color:var(--orange);">Edit Village</h3>
        <form id="editForm">
            <input type="hidden" id="edit_vil_id">
            <div class="form-group">
                <label>Village Name *</label>
                <input type="text" id="edit_vil_name" required>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="config.js"></script>
<script src="includes/header.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        if (!isAdmin()) {
            showToast("Access denied.", "error");
            window.location.href = "index.html";
            return;
        }
        await loadVillagesData();
    });

    function syncData() {
        loadVillagesData();
    }

    async function loadVillagesData() {
        const sysData = getSystemDataImmediate();
        if (!sysData) return;

        const villages = sysData.villages || [];
        const donations = sysData.donations || [];

        // Compute statistics per village
        const stats = {};
        villages.forEach(v => {
            stats[v.name] = { id: v.id, total: 0, count: 0 };
        });

        donations.forEach(d => {
            const vName = d.village;
            if (stats[vName]) {
                stats[vName].total += parseFloat(d.amount || 0);
                stats[vName].count += 1;
            }
        });

        // Set KPIs
        document.getElementById("kpi_total_villages").innerText = villages.length;
        let totalColl = 0, totalReceipts = 0;
        donations.forEach(d => {
            totalColl += parseFloat(d.amount || 0);
            totalReceipts++;
        });
        document.getElementById("kpi_total_collected").innerText = "₹" + totalColl.toLocaleString();
        document.getElementById("kpi_total_slips").innerText = totalReceipts + " slips";

        // Populate Table
        const tbody = document.getElementById("villages_tbody");
        tbody.innerHTML = "";

        if (villages.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="padding:15px; text-align:center; color:var(--muted)">No villages found.</td></tr>`;
            return;
        }

        villages.sort((a,b) => a.name.localeCompare(b.name)).forEach(v => {
            const rowStats = stats[v.name] || { id: v.id, total: 0, count: 0 };
            tbody.innerHTML += `
                <tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:10px;"><strong>${v.name}</strong></td>
                    <td style="padding:10px; color:#2ecc40; font-weight:bold;">₹${rowStats.total.toLocaleString()}</td>
                    <td style="padding:10px;">${rowStats.count} slips</td>
                    <td style="padding:10px; text-align:right;">
                        <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="openEdit('${v.id}', '${v.name}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-dark" style="padding:4px 8px; font-size:11px; background:#ff4136;" onclick="deleteVillage('${v.id}', '${v.name}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById("villageForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("vil_name").value.trim();

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "saveVillage",
                    village: { name: name },
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                showToast("गाँव सफलतापूर्वक जोड़ा गया!");
                window.location.reload();
            } else {
                showToast("त्रुटि: " + data.message, "error");
            }
        } catch(err) {
            showToast("कनेक्शन एरर!", "error");
        }
    });

    function openEdit(id, name) {
        document.getElementById("edit_vil_id").value = id;
        document.getElementById("edit_vil_name").value = name;
        document.getElementById("editModal").style.display = "flex";
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("edit_vil_id").value;
        const name = document.getElementById("edit_vil_name").value.trim();

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "saveVillage",
                    village: { id: id, name: name },
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                showToast("गाँव सफलतापूर्वक अपडेट किया गया!");
                window.location.reload();
            } else {
                showToast("त्रुटि: " + data.message, "error");
            }
        } catch(err) {
            showToast("त्रुटि आई।", "error");
        }
    });

    async function deleteVillage(id, name) {
        if (!confirm(`क्या आप वाकई गाँव "${name}" को हटाना चाहते हैं?`)) return;

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "deleteRecord",
                    table: "villages",
                    keyColumn: "id",
                    value: id,
                    currentUser: getCurrentUser()
                })
            });
            const data = await res.json();
            if (data.success) {
                invalidateCache();
                showToast("गाँव सफलतापूर्वक हटा दिया गया है!");
                window.location.reload();
            } else {
                showToast("त्रुटि: " + data.message, "error");
            }
        } catch(err) {
            showToast("त्रुटि आई।", "error");
        }
    }

    function exportCSV() {
        let csv = [];
        let rows = document.querySelectorAll("table tr");
        for (let i = 0; i < rows.length; i++) {
            let row = [], cols = rows[i].querySelectorAll("td, th");
            for (let j = 0; j < cols.length - 1; j++) {
                let text = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, " ").trim();
                row.push('"' + text.replace(/"/g, '""') + '"');
            }
            csv.push(row.join(","));
        }
        let csvFile = new Blob([csv.join("\n")], {type: "text/csv;charset=utf-8;"});
        let downloadLink = document.createElement("a");
        downloadLink.download = "villages_stats.csv";
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
    }
</script>
</body>
</html>
